<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="640" viewBox="0 0 1300 640">
  <style>
    text { font-family: 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #17233c; }
    .sub { font-size: 15px; fill: #526078; }
    .head { font-size: 18px; font-weight: 700; fill: #17233c; }
    .label { font-size: 15px; font-weight: 700; fill: #24324a; }
    .body { font-size: 14px; fill: #33425d; }
    .small { font-size: 13px; fill: #526078; }
    .mono { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #24324a; }
    .axis { stroke: #8794a8; stroke-width: 1.5; }
    .stair { fill: none; stroke: #2e69a3; stroke-width: 2.5; }
    .wave { fill: none; stroke: #c96a12; stroke-width: 2.5; }
    .zoom { fill: none; stroke: #8794a8; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .box { fill: #fff0d7; stroke: #bd7711; stroke-width: 2; }
  </style>

  <rect width="1300" height="640" fill="#ffffff"/>
  <text x="650" y="40" text-anchor="middle" class="title">pwm_fade.c — DUTY를 조금씩 바꾸면 밝기가 부드럽게 변한다</text>
  <text x="650" y="66" text-anchor="middle" class="sub">for 문이 10 ms마다 DUTY를 500(1 %)씩 바꾼다. 1초 동안 0 → 100 %, 다음 1초 동안 100 → 0 %.</text>

  <!-- duty vs time -->
  <text x="40" y="210" class="head">DUTY 값</text>
  <path d="M150 300 H1220" class="axis"/><path d="M150 300 V100" class="axis"/>
  <text x="140" y="114" text-anchor="end" class="mono">50000</text>
  <text x="140" y="304" text-anchor="end" class="mono">0</text>
  <path d="M150 300 H175 V280 H200 V260 H225 V240 H250 V220 H275 V200 H300 V180 H325 V160 H350 V140 H375 V120 H400 V110 H425 V120 H450 V140 H475 V160 H500 V180 H525 V200 H550 V220 H575 V240 H600 V260 H625 V280 H650 V300 H675 V280 H700 V260 H725 V240 H750 V220 H775 V200 H800 V180 H825 V160 H850 V140 H875 V120 H900 V110 H925 V120 H950 V140 H975 V160 H1000 V180 H1025 V200 H1050 V220 H1075 V240 H1100 V260 H1125 V280 H1150 V300 H1175" class="stair"/>
  <text x="150" y="324" text-anchor="middle" class="small">0 s</text>
  <text x="400" y="324" text-anchor="middle" class="small">1 s</text>
  <text x="650" y="324" text-anchor="middle" class="small">2 s</text>
  <text x="900" y="324" text-anchor="middle" class="small">3 s</text>
  <text x="1150" y="324" text-anchor="middle" class="small">4 s</text>
  <text x="275" y="94" text-anchor="middle" class="small" fill="#1f4f80">첫 번째 for : 점점 밝게</text>
  <text x="525" y="94" text-anchor="middle" class="small" fill="#1f4f80">두 번째 for : 점점 어둡게</text>
  <text x="1185" y="200" class="small">계단 하나</text>
  <text x="1185" y="218" class="small">= 10 ms,</text>
  <text x="1185" y="236" class="small">+500</text>

  <!-- zoom markers -->
  <circle cx="212" cy="260" r="6" fill="#c96a12"/>
  <circle cx="275" cy="200" r="6" fill="#c96a12"/>
  <circle cx="400" cy="110" r="6" fill="#c96a12"/>
  <path d="M212 266 L180 380" class="zoom"/>
  <path d="M275 206 L560 380" class="zoom"/>
  <path d="M400 116 L940 380" class="zoom"/>

  <!-- zoomed PWM -->
  <rect x="60" y="380" width="360" height="150" rx="10" class="box"/>
  <text x="240" y="408" text-anchor="middle" class="label">약 0.25 s — DUTY 12500</text>
  <path d="M80 500 V450 H110 V500 H200 V450 H230 V500 H320 V450 H350 V500 H400" class="wave"/>
  <text x="240" y="520" text-anchor="middle" class="small">25 % — 어둡게</text>

  <rect x="470" y="380" width="360" height="150" rx="10" class="box"/>
  <text x="650" y="408" text-anchor="middle" class="label">약 0.5 s — DUTY 25000</text>
  <path d="M490 500 V450 H550 V500 H610 V450 H670 V500 H730 V450 H790 V500 H810" class="wave"/>
  <text x="650" y="520" text-anchor="middle" class="small">50 %</text>

  <rect x="880" y="380" width="360" height="150" rx="10" class="box"/>
  <text x="1060" y="408" text-anchor="middle" class="label">약 1 s — DUTY 50000</text>
  <path d="M900 500 V450 H1220" class="wave"/>
  <text x="1060" y="520" text-anchor="middle" class="small">100 % — 가장 밝게</text>

  <rect x="30" y="555" width="1240" height="70" rx="10" fill="#f8fafc" stroke="#a7bad0" stroke-width="1.5"/>
  <text x="50" y="582" class="body">아래 세 상자는 각 순간의 PWM 파형을 확대한 것이다. 주기(1 ms)는 언제나 같고, 켜진 폭만 넓어졌다 좁아진다. (위 계단은 크게 그렸다. 실제는 100칸이라 비탈처럼 보인다)</text>
  <text x="50" y="606" class="body">10 ms 동안 같은 DUTY가 유지되므로, 그 사이 PWM은 10번 깜빡인다. 그다음 for가 DUTY를 500 바꾼다.</text>
</svg>
