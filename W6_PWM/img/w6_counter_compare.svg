<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="620" viewBox="0 0 1300 620">
  <style>
    text { font-family: 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #17233c; }
    .sub { font-size: 15px; fill: #526078; }
    .head { font-size: 18px; font-weight: 700; fill: #17233c; }
    .label { font-size: 15px; font-weight: 700; fill: #24324a; }
    .body { font-size: 14px; fill: #33425d; }
    .small { font-size: 13px; fill: #526078; }
    .mono { font-family: Consolas, 'Courier New', monospace; font-size: 14px; fill: #24324a; }
    .saw { fill: none; stroke: #2e69a3; stroke-width: 3; }
    .duty { stroke: #c63838; stroke-width: 2.5; stroke-dasharray: 9 5; }
    .wave { fill: none; stroke: #c96a12; stroke-width: 3; }
    .onband { fill: #e7f5ea; }
    .guide { stroke: #8794a8; stroke-width: 1.3; stroke-dasharray: 4 4; }
    .axis { stroke: #8794a8; stroke-width: 1.5; }
  </style>

  <rect width="1300" height="620" fill="#ffffff"/>
  <text x="650" y="40" text-anchor="middle" class="title">카운터 + 비교기 = PWM</text>
  <text x="650" y="66" text-anchor="middle" class="sub">카운터는 0 → PERIOD−1을 반복하고(톱니), 비교기는 "카운터 &lt; DUTY"인 동안만 1을 낸다.</text>

  <!-- on bands -->
  <rect x="220" y="100" width="60" height="400" class="onband"/><rect x="420" y="100" width="60" height="400" class="onband"/>
  <rect x="620" y="100" width="60" height="400" class="onband"/><rect x="820" y="100" width="60" height="400" class="onband"/>

  <!-- counter -->
  <text x="40" y="150" class="head">① 카운터</text>
  <text x="40" y="174" class="mono">pwm_cnt</text>
  <path d="M220 330 H1040" class="axis"/>
  <path d="M220 330 L420 130 V330 L620 130 V330 L820 130 V330 L1020 130 V330" class="saw"/>
  <text x="210" y="135" text-anchor="end" class="mono">PERIOD−1</text>
  <text x="210" y="334" text-anchor="end" class="mono">0</text>
  <path d="M220 270 H1040" class="duty"/>
  <text x="1050" y="275" class="mono" fill="#c63838">DUTY</text>
  <path d="M280 100 V500" class="guide"/><path d="M480 100 V500" class="guide"/><path d="M680 100 V500" class="guide"/><path d="M880 100 V500" class="guide"/>
  <text x="250" y="122" text-anchor="middle" class="label" fill="#1d6b33">켜짐</text>
  <text x="560" y="300" text-anchor="middle" class="small">꺼짐</text>
  <text x="560" y="318" text-anchor="middle" class="small">(카운터 ≥ DUTY)</text>

  <!-- compare -->
  <text x="40" y="410" class="head">② 비교기 출력</text>
  <text x="40" y="434" class="mono">led4</text>
  <path d="M220 460 V400 H280 V460 H420 V400 H480 V460 H620 V400 H680 V460 H820 V400 H880 V460 H1020" class="wave"/>
  <text x="210" y="405" text-anchor="end" class="small">1111</text><text x="210" y="464" text-anchor="end" class="small">0000</text>

  <!-- period dimension -->
  <path d="M220 485 H420" stroke="#526078" stroke-width="1.6"/><path d="M220 478 V492 M420 478 V492" stroke="#526078" stroke-width="1.6"/>
  <text x="320" y="506" text-anchor="middle" class="small">PERIOD 클럭 = 한 주기</text>
  <path d="M220 386 H280" stroke="#c96a12" stroke-width="1.6"/><path d="M220 380 V392 M280 380 V392" stroke="#c96a12" stroke-width="1.6"/>
  <text x="250" y="376" text-anchor="middle" class="small" fill="#a05d0c">DUTY 클럭</text>

  <!-- side note -->
  <rect x="1090" y="380" width="180" height="100" rx="10" fill="#fff0d7" stroke="#bd7711" stroke-width="2"/>
  <text x="1180" y="408" text-anchor="middle" class="label">DUTY 선을</text>
  <text x="1180" y="432" text-anchor="middle" class="body">올리면 → 넓게(밝게)</text>
  <text x="1180" y="456" text-anchor="middle" class="body">내리면 → 좁게(어둡게)</text>

  <rect x="30" y="530" width="1240" height="72" rx="10" fill="#f8fafc" stroke="#a7bad0" stroke-width="1.5"/>
  <text x="50" y="558" class="body">초록 띠가 "카운터가 빨간 DUTY 선보다 아래"인 구간이다. 이 구간에서만 led4 = 1111(켜짐)이다.</text>
  <text x="50" y="582" class="body">카운터는 그대로 두고 DUTY 숫자 하나만 바꾸면 켜진 폭이 바뀐다. 주기를 바꾸려면 PERIOD를 바꾼다(톱니의 높이와 폭이 바뀐다).</text>
</svg>
