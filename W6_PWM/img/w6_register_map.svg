<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="600" viewBox="0 0 1300 600">
  <style>
    text { font-family: 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #17233c; }
    .sub { font-size: 15px; fill: #526078; }
    .head { font-size: 18px; font-weight: 700; fill: #17233c; }
    .label { font-size: 15px; font-weight: 700; fill: #24324a; }
    .body { font-size: 14px; fill: #33425d; }
    .small { font-size: 13px; fill: #526078; }
    .mono { font-family: Consolas, 'Courier New', monospace; font-size: 14px; fill: #24324a; }
    .ps { fill: #f4f6fa; stroke: #65738a; stroke-width: 2.5; }
    .code { fill: #ffffff; stroke: #a7bad0; stroke-width: 1.5; }
    .wcell { fill: #fdebd5; stroke: #c96a12; stroke-width: 2; }
    .ncell { fill: #f4f6fa; stroke: #a7bad0; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .user { fill: #fff0d7; stroke: #bd7711; stroke-width: 3; }
    .blk { fill: #ffffff; stroke: #bd7711; stroke-width: 2; }
    .board { fill: #e7f5ea; stroke: #238636; stroke-width: 2.5; }
    .wr { fill: none; stroke: #c96a12; stroke-width: 3; marker-end: url(#o); }
    .cmd { fill: none; stroke: #7152a5; stroke-width: 2.5; marker-end: url(#p); }
  </style>
  <defs>
    <marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c96a12"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7152a5"/></marker>
  </defs>

  <rect width="1300" height="600" fill="#ffffff"/>
  <text x="650" y="40" text-anchor="middle" class="title">my_pwm 레지스터 맵 — 레지스터는 핀이 아니라 "명령"이다</text>
  <text x="650" y="66" text-anchor="middle" class="sub">PS는 세 칸에 명령을 쓰기만 한다. 핀으로 나가는 파형은 가운데 PWM 회로가 만든다.</text>

  <text x="170" y="104" text-anchor="middle" class="head">PS — C 코드</text>
  <text x="480" y="104" text-anchor="middle" class="head">레지스터 (주소)</text>
  <text x="845" y="104" text-anchor="middle" class="head">PWM 회로 (user logic)</text>
  <text x="1170" y="104" text-anchor="middle" class="head">보드</text>

  <rect x="30" y="118" width="280" height="370" rx="14" class="ps"/>
  <rect x="45" y="140" width="250" height="60" rx="8" class="code"/>
  <text x="57" y="176" class="mono" font-size="13">Xil_Out32(PWM_CTRL, 1);</text>
  <rect x="45" y="230" width="250" height="60" rx="8" class="code"/>
  <text x="57" y="266" class="mono" font-size="13">Xil_Out32(PWM_PERIOD, 50000);</text>
  <rect x="45" y="320" width="250" height="60" rx="8" class="code"/>
  <text x="57" y="356" class="mono" font-size="13">Xil_Out32(PWM_DUTY, 25000);</text>
  <text x="170" y="430" text-anchor="middle" class="small">세 줄 다 "쓰기"다</text>
  <text x="170" y="450" text-anchor="middle" class="small">읽을 레지스터는 없다</text>

  <path d="M310 170 H376" class="wr"/><path d="M310 260 H376" class="wr"/><path d="M310 350 H376" class="wr"/>

  <rect x="380" y="140" width="200" height="60" rx="8" class="wcell"/>
  <text x="480" y="164" text-anchor="middle" class="mono">+0x0  CTRL</text>
  <text x="480" y="186" text-anchor="middle" class="small">[0] EN : 1 동작 / 0 정지</text>
  <rect x="380" y="230" width="200" height="60" rx="8" class="wcell"/>
  <text x="480" y="254" text-anchor="middle" class="mono">+0x4  PERIOD</text>
  <text x="480" y="276" text-anchor="middle" class="small">[15:0] 한 주기 (클럭 수)</text>
  <rect x="380" y="320" width="200" height="60" rx="8" class="wcell"/>
  <text x="480" y="344" text-anchor="middle" class="mono">+0x8  DUTY</text>
  <text x="480" y="366" text-anchor="middle" class="small">[15:0] 켜진 시간 (클럭 수)</text>
  <rect x="380" y="410" width="200" height="60" rx="8" class="ncell"/>
  <text x="480" y="434" text-anchor="middle" class="mono" fill="#8794a8">+0xC  —</text>
  <text x="480" y="456" text-anchor="middle" class="small">쓰지 않는다</text>

  <!-- PWM circuit -->
  <rect x="660" y="118" width="370" height="370" rx="14" class="user"/>
  <rect x="690" y="190" width="160" height="100" rx="10" class="blk"/>
  <text x="770" y="226" text-anchor="middle" class="label">카운터</text>
  <text x="770" y="250" text-anchor="middle" class="mono" font-size="13">0 ~ PERIOD−1</text>
  <text x="770" y="272" text-anchor="middle" class="small">반복</text>
  <rect x="690" y="330" width="160" height="100" rx="10" class="blk"/>
  <text x="770" y="366" text-anchor="middle" class="label">비교기</text>
  <text x="770" y="390" text-anchor="middle" class="mono" font-size="13">카운터 &lt; DUTY</text>
  <text x="770" y="412" text-anchor="middle" class="small">이면 켜짐</text>
  <path d="M770 290 V326" class="wr"/>

  <path d="M580 170 H620 V150 H905 V325" class="cmd"/>
  <path d="M620 170 V215 H686" class="cmd"/>
  <text x="640" y="142" class="small" fill="#5b3f8f">EN</text>
  <path d="M580 260 H686" class="cmd"/>
  <text x="630" y="252" text-anchor="middle" class="small" fill="#5b3f8f">PERIOD</text>
  <path d="M580 350 H600 V380 H686" class="cmd"/>
  <text x="640" y="372" text-anchor="middle" class="small" fill="#5b3f8f">DUTY</text>
  <rect x="870" y="330" width="130" height="100" rx="10" class="blk"/>
  <text x="935" y="366" text-anchor="middle" class="label">EN AND</text>
  <text x="935" y="392" text-anchor="middle" class="small">정지면 끈다</text>
  <path d="M850 380 H866" class="wr"/>

  <path d="M1000 380 H1076" class="wr"/>
  <text x="1040" y="370" text-anchor="middle" class="mono">led4</text>

  <rect x="1080" y="118" width="190" height="370" rx="14" class="board"/>
  <text x="1175" y="200" text-anchor="middle" class="label">shield LED ×4</text>
  <circle cx="1120" cy="250" r="14" fill="#f2c200" fill-opacity="0.5" stroke="#a07c00" stroke-width="2"/>
  <circle cx="1160" cy="250" r="14" fill="#f2c200" fill-opacity="0.5" stroke="#a07c00" stroke-width="2"/>
  <circle cx="1200" cy="250" r="14" fill="#f2c200" fill-opacity="0.5" stroke="#a07c00" stroke-width="2"/>
  <circle cx="1240" cy="250" r="14" fill="#f2c200" fill-opacity="0.5" stroke="#a07c00" stroke-width="2"/>
  <text x="1175" y="300" text-anchor="middle" class="body">네 개 모두</text>
  <text x="1175" y="322" text-anchor="middle" class="body">같은 밝기</text>
  <text x="1175" y="380" text-anchor="middle" class="small">25000 / 50000</text>
  <text x="1175" y="400" text-anchor="middle" class="small">= 50 %</text>

  <rect x="30" y="510" width="1240" height="74" rx="10" fill="#f8fafc" stroke="#a7bad0" stroke-width="1.5"/>
  <text x="50" y="538" class="body">주황 화살표 = PS가 쓰는 값(AXI 쓰기)과 회로 안의 신호. 보라 화살표 = 레지스터가 회로에 내리는 명령.</text>
  <text x="50" y="562" class="body">5주차 my_io는 레지스터 → 핀이 바로 이어졌다. my_pwm은 레지스터 → 회로 → 핀이다. 그래서 PS는 한 번 쓰면 끝이고, 깜빡임은 회로가 계속 만든다.</text>
</svg>
