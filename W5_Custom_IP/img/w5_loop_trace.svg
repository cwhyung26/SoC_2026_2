<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="640" viewBox="0 0 1300 640">
  <style>
    text { font-family: 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #17233c; }
    .sub { font-size: 15px; fill: #526078; }
    .head { font-size: 18px; font-weight: 700; fill: #17233c; }
    .label { font-size: 15px; font-weight: 700; fill: #24324a; }
    .body { font-size: 14px; fill: #33425d; }
    .small { font-size: 13px; fill: #526078; }
    .mono { font-family: Consolas, 'Courier New', monospace; font-size: 14px; fill: #24324a; }
    .val { font-family: Consolas, 'Courier New', monospace; font-size: 15px; font-weight: 700; fill: #17233c; }
    .ps { fill: #f4f6fa; stroke: #65738a; stroke-width: 2.5; }
    .user { fill: #fff0d7; stroke: #bd7711; stroke-width: 3; }
    .board { fill: #e7f5ea; stroke: #238636; stroke-width: 2.5; }
    .code { fill: #ffffff; stroke: #a7bad0; stroke-width: 1.5; }
    .wr { fill: none; stroke: #c96a12; stroke-width: 3; marker-end: url(#o); }
    .rd { fill: none; stroke: #13889c; stroke-width: 3; marker-end: url(#t); }
    .var { fill: none; stroke: #7152a5; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#p); }
    .num { font-size: 15px; font-weight: 700; fill: #ffffff; }
  </style>
  <defs>
    <marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c96a12"/></marker>
    <marker id="t" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#13889c"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7152a5"/></marker>
  </defs>

  <rect width="1300" height="640" fill="#ffffff"/>
  <text x="650" y="40" text-anchor="middle" class="title">while 한 바퀴 따라가기 — 스위치 0101, BTN0만 누름</text>
  <text x="650" y="66" text-anchor="middle" class="sub">값은 보드 → my_io → PS 변수로 올라갔다가(①②), PS → my_io → 보드로 내려온다(③④). PL 안에서 스위치와 LED가 직접 이어진 것이 아니다.</text>

  <text x="150" y="104" text-anchor="middle" class="head">보드</text>
  <text x="595" y="104" text-anchor="middle" class="head">my_io_0 (1장 Verilog)</text>
  <text x="1135" y="104" text-anchor="middle" class="head">PS (C 변수)</text>

  <rect x="30" y="118" width="240" height="440" rx="14" class="board"/>
  <rect x="430" y="118" width="330" height="440" rx="14" class="user"/>
  <rect x="1000" y="118" width="270" height="440" rx="14" class="ps"/>

  <!-- ① sw -->
  <text x="150" y="150" text-anchor="middle" class="label">shield 스위치</text>
  <g>
    <rect x="66" y="162" width="30" height="40" rx="4" fill="#ffffff" stroke="#238636" stroke-width="2"/><rect x="72" y="184" width="18" height="14" fill="#8794a8"/>
    <rect x="102" y="162" width="30" height="40" rx="4" fill="#ffffff" stroke="#238636" stroke-width="2"/><rect x="108" y="166" width="18" height="14" fill="#238636"/>
    <rect x="138" y="162" width="30" height="40" rx="4" fill="#ffffff" stroke="#238636" stroke-width="2"/><rect x="144" y="184" width="18" height="14" fill="#8794a8"/>
    <rect x="174" y="162" width="30" height="40" rx="4" fill="#ffffff" stroke="#238636" stroke-width="2"/><rect x="180" y="166" width="18" height="14" fill="#238636"/>
    <text x="81" y="218" text-anchor="middle" class="small">[3]</text><text x="117" y="218" text-anchor="middle" class="small">[2]</text>
    <text x="153" y="218" text-anchor="middle" class="small">[1]</text><text x="189" y="218" text-anchor="middle" class="small">[0]</text>
  </g>
  <text x="235" y="190" class="val">0101</text>
  <path d="M270 185 H440" class="rd"/>
  <text x="355" y="174" text-anchor="middle" class="mono" fill="#0f6f80">sw4 핀</text>
  <rect x="450" y="150" width="290" height="70" rx="8" class="code"/>
  <text x="462" y="178" class="mono" font-size="13">2'h2: reg_data_out &lt;=</text>
  <text x="462" y="202" class="mono" font-size="13">      {28'd0, sw4};</text>
  <path d="M760 185 H996" class="rd"/>
  <circle cx="776" cy="160" r="13" fill="#13889c"/><text x="776" y="165" text-anchor="middle" class="num">1</text>
  <text x="888" y="166" text-anchor="middle" class="mono" font-size="13" fill="#0f6f80">Xil_In32(0x43C0_0008)</text>
  <text x="880" y="206" text-anchor="middle" class="mono" font-size="13" fill="#0f6f80">RDATA = 0x00000005</text>
  <rect x="1020" y="160" width="200" height="50" rx="8" class="code"/>
  <text x="1120" y="191" text-anchor="middle" class="val">sw = 5</text>

  <!-- ② btn -->
  <text x="150" y="260" text-anchor="middle" class="label">버튼</text>
  <circle cx="110" cy="290" r="16" fill="#238636" stroke="#17233c" stroke-width="1.5"/>
  <circle cx="190" cy="290" r="16" fill="#ffffff" stroke="#17233c" stroke-width="1.5"/>
  <text x="110" y="324" text-anchor="middle" class="small">BTN0 누름</text>
  <text x="190" y="324" text-anchor="middle" class="small">BTN1</text>
  <text x="235" y="282" class="val">01</text>
  <path d="M270 285 H440" class="rd"/>
  <text x="355" y="274" text-anchor="middle" class="mono" fill="#0f6f80">btn2 핀</text>
  <rect x="450" y="250" width="290" height="70" rx="8" class="code"/>
  <text x="462" y="278" class="mono" font-size="13">2'h3: reg_data_out &lt;=</text>
  <text x="462" y="302" class="mono" font-size="13">      {30'd0, btn2};</text>
  <path d="M760 285 H996" class="rd"/>
  <circle cx="776" cy="260" r="13" fill="#13889c"/><text x="776" y="265" text-anchor="middle" class="num">2</text>
  <text x="888" y="266" text-anchor="middle" class="mono" font-size="13" fill="#0f6f80">Xil_In32(0x43C0_000C)</text>
  <text x="880" y="306" text-anchor="middle" class="mono" font-size="13" fill="#0f6f80">RDATA = 0x00000001</text>
  <rect x="1020" y="260" width="200" height="50" rx="8" class="code"/>
  <text x="1120" y="291" text-anchor="middle" class="val">btn = 1</text>

  <!-- variables go back down -->
  <path d="M1220 185 H1255 V400 H1224" class="var"/>
  <path d="M1220 285 H1235 V480 H1224" class="var"/>

  <!-- ③ led4 -->
  <rect x="1020" y="375" width="200" height="50" rx="8" class="code"/>
  <text x="1120" y="398" text-anchor="middle" class="mono" font-size="13">Xil_Out32(REG_LED4,</text>
  <text x="1120" y="416" text-anchor="middle" class="mono" font-size="13">sw);</text>
  <path d="M1000 400 H764" class="wr"/>
  <circle cx="970" cy="375" r="13" fill="#c96a12"/><text x="970" y="380" text-anchor="middle" class="num">3</text>
  <text x="880" y="381" text-anchor="middle" class="mono" font-size="13" fill="#a05d0c">쓰기 0x43C0_0000</text>
  <text x="880" y="421" text-anchor="middle" class="mono" font-size="13" fill="#a05d0c">WDATA = 0x00000005</text>
  <rect x="450" y="365" width="290" height="70" rx="8" class="code"/>
  <text x="462" y="393" class="mono" font-size="13">slv_reg0 = 5</text>
  <text x="462" y="417" class="mono" font-size="13">assign led4 = slv_reg0[3:0];</text>
  <path d="M440 400 H274" class="wr"/>
  <text x="355" y="389" text-anchor="middle" class="mono" fill="#a05d0c">led4 핀</text>
  <text x="150" y="366" text-anchor="middle" class="label">shield LED</text>
  <circle cx="81" cy="398" r="12" fill="#ffffff" stroke="#8794a8" stroke-width="2"/>
  <circle cx="117" cy="398" r="12" fill="#f2c200" stroke="#a07c00" stroke-width="2"/>
  <circle cx="153" cy="398" r="12" fill="#ffffff" stroke="#8794a8" stroke-width="2"/>
  <circle cx="189" cy="398" r="12" fill="#f2c200" stroke="#a07c00" stroke-width="2"/>
  <text x="81" y="428" text-anchor="middle" class="small">[3]</text><text x="117" y="428" text-anchor="middle" class="small">[2]</text>
  <text x="153" y="428" text-anchor="middle" class="small">[1]</text><text x="189" y="428" text-anchor="middle" class="small">[0]</text>
  <text x="235" y="404" class="val">0101</text>

  <!-- ④ led3 -->
  <rect x="1020" y="455" width="200" height="50" rx="8" class="code"/>
  <text x="1120" y="478" text-anchor="middle" class="mono" font-size="13">Xil_Out32(REG_LED3,</text>
  <text x="1120" y="496" text-anchor="middle" class="mono" font-size="13">btn);</text>
  <path d="M1000 480 H764" class="wr"/>
  <circle cx="970" cy="455" r="13" fill="#c96a12"/><text x="970" y="460" text-anchor="middle" class="num">4</text>
  <text x="880" y="461" text-anchor="middle" class="mono" font-size="13" fill="#a05d0c">쓰기 0x43C0_0004</text>
  <text x="880" y="501" text-anchor="middle" class="mono" font-size="13" fill="#a05d0c">WDATA = 0x00000001</text>
  <rect x="450" y="445" width="290" height="70" rx="8" class="code"/>
  <text x="462" y="473" class="mono" font-size="13">slv_reg1 = 1</text>
  <text x="462" y="497" class="mono" font-size="13">assign led3 = slv_reg1[2:0];</text>
  <path d="M440 480 H274" class="wr"/>
  <text x="355" y="469" text-anchor="middle" class="mono" fill="#a05d0c">led3 핀</text>
  <text x="150" y="462" text-anchor="middle" class="label">RGB LED1</text>
  <circle cx="100" cy="494" r="16" fill="#e5383b" stroke="#17233c" stroke-width="1.5"/>
  <text x="165" y="490" class="val" font-size="14">001</text>
  <text x="165" y="510" class="small">→ 빨강</text>
  <text x="235" y="540" text-anchor="end" class="small">[2]B [1]G [0]R</text>

  <!-- notes -->
  <rect x="30" y="572" width="1240" height="54" rx="10" fill="#f8fafc" stroke="#a7bad0" stroke-width="1.5"/>
  <text x="50" y="596" class="body">청록 = 읽기(Xil_In32), 주황 = 쓰기(Xil_Out32), 보라 점선 = C 변수에 담겨 다음 줄로 넘어가는 값.</text>
  <text x="50" y="616" class="body">이 네 동작 뒤 printf와 usleep(200000)으로 0.2초 쉬고 다시 ①부터 — 그래서 LED는 스위치를 최대 0.2초 늦게 따라온다.</text>
</svg>
