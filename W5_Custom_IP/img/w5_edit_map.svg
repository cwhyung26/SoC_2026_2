<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="740" viewBox="0 0 1300 740">
  <style>
    text { font-family: 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #17233c; }
    .sub { font-size: 15px; fill: #526078; }
    .head { font-size: 18px; font-weight: 700; fill: #17233c; }
    .label { font-size: 16px; font-weight: 700; fill: #24324a; }
    .body { font-size: 14px; fill: #33425d; }
    .small { font-size: 13px; fill: #526078; }
    .mono { font-family: Consolas, 'Courier New', monospace; font-size: 14px; fill: #24324a; }
    .file { fill: #f7f8fb; stroke: #65738a; stroke-width: 2.5; }
    .tmpl { fill: #eaf4ff; stroke: #2e69a3; stroke-width: 2; }
    .user { fill: #fff0d7; stroke: #bd7711; stroke-width: 2.5; }
    .note { fill: #fff6f6; stroke: #c63838; stroke-width: 2; }
    .num { font-size: 20px; font-weight: 700; fill: #ffffff; }
    .arrow { fill: none; stroke: #8a5a12; stroke-width: 2.5; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8a5a12"/></marker>
  </defs>

  <rect width="1300" height="740" fill="#ffffff"/>
  <text x="650" y="40" text-anchor="middle" class="title">Verilog를 고치는 다섯 군데</text>
  <text x="650" y="66" text-anchor="middle" class="sub">파일 안의 위치 순서대로 그렸다. 주황색 칸만 고치고, 파란색 칸은 템플릿 그대로 둔다.</text>

  <!-- left file -->
  <rect x="40" y="95" width="640" height="590" rx="16" class="file"/>
  <text x="65" y="127" class="head">my_io_v1_0_S00_AXI.v</text>
  <text x="290" y="127" class="small">실제 내용 — 세 군데</text>

  <rect x="65" y="145" width="590" height="95" rx="10" class="user"/>
  <circle cx="95" cy="175" r="16" fill="#bd7711"/><text x="95" y="182" text-anchor="middle" class="num">1</text>
  <text x="125" y="181" class="label">사용자 포트 선언</text>
  <text x="125" y="207" class="mono">// Users to add ports here</text>
  <text x="125" y="228" class="body">output led4[3:0], led3[2:0] · input sw4[3:0], btn2[1:0]</text>

  <rect x="65" y="255" width="590" height="78" rx="10" class="tmpl"/>
  <text x="95" y="285" class="label">AXI 핸드셰이크</text>
  <text x="95" y="311" class="mono">axi_awready  axi_wready  axi_bvalid  axi_arready  axi_rvalid</text>
  <text x="635" y="285" text-anchor="end" class="small">손대지 않는다</text>

  <rect x="65" y="348" width="590" height="78" rx="10" class="tmpl"/>
  <text x="95" y="378" class="label">쓰기 → slv_reg0~3</text>
  <text x="95" y="404" class="mono">slv_reg_wren · case (axi_awaddr[3:2])</text>
  <text x="635" y="378" text-anchor="end" class="small">읽기만 한다</text>

  <rect x="65" y="441" width="590" height="110" rx="10" class="user"/>
  <circle cx="95" cy="471" r="16" fill="#bd7711"/><text x="95" y="478" text-anchor="middle" class="num">2</text>
  <text x="125" y="477" class="label">읽기 선택 — 두 줄 바꾸기</text>
  <text x="125" y="505" class="mono">2'h2 : reg_data_out &lt;= {28'd0, sw4};</text>
  <text x="125" y="529" class="mono">2'h3 : reg_data_out &lt;= {30'd0, btn2};</text>
  <text x="635" y="477" text-anchor="end" class="small">reg_data_out</text>

  <rect x="65" y="566" width="590" height="100" rx="10" class="user"/>
  <circle cx="95" cy="596" r="16" fill="#bd7711"/><text x="95" y="603" text-anchor="middle" class="num">3</text>
  <text x="125" y="602" class="label">레지스터 → 핀</text>
  <text x="125" y="630" class="mono">assign led4 = slv_reg0[3:0];</text>
  <text x="125" y="652" class="mono">assign led3 = slv_reg1[2:0];</text>
  <text x="635" y="602" text-anchor="end" class="small">Add user logic here</text>

  <!-- right file -->
  <rect x="760" y="95" width="500" height="370" rx="16" class="file"/>
  <text x="785" y="127" class="head">my_io_v1_0.v</text>
  <text x="920" y="127" class="small">바깥 포장 — 두 군데</text>

  <rect x="785" y="145" width="450" height="95" rx="10" class="user"/>
  <circle cx="815" cy="175" r="16" fill="#bd7711"/><text x="815" y="182" text-anchor="middle" class="num">4</text>
  <text x="845" y="181" class="label">사용자 포트 선언</text>
  <text x="845" y="207" class="mono">// Users to add ports here</text>
  <text x="845" y="228" class="body">①과 같은 네 줄</text>

  <rect x="785" y="255" width="450" height="185" rx="10" class="user"/>
  <circle cx="815" cy="285" r="16" fill="#bd7711"/><text x="815" y="292" text-anchor="middle" class="num">5</text>
  <text x="845" y="291" class="label">안쪽 모듈에 연결</text>
  <text x="845" y="320" class="mono">) my_io_v1_0_S00_AXI_inst (</text>
  <text x="865" y="344" class="mono">.led4(led4),</text>
  <text x="865" y="366" class="mono">.led3(led3),</text>
  <text x="865" y="388" class="mono">.sw4(sw4),</text>
  <text x="865" y="410" class="mono">.btn2(btn2),</text>
  <text x="1215" y="344" text-anchor="end" class="small">점 뒤: 안쪽 포트</text>
  <text x="1215" y="366" text-anchor="end" class="small">괄호 안: 바깥 포트</text>

  <path d="M785 192 H722 V180 H659" class="arrow"/>
  <text x="722" y="170" text-anchor="middle" class="small">같은 이름</text>
  <path d="M785 360 H710 V215 H659" class="arrow"/>

  <!-- what breaks -->
  <rect x="760" y="490" width="500" height="195" rx="14" class="note"/>
  <text x="785" y="522" class="label" fill="#a12d2d">하나라도 빠지면</text>
  <text x="785" y="555" class="body">①·④ 빠짐 → 포트가 IP 밖에 보이지 않는다</text>
  <text x="785" y="585" class="body">⑤ 빠짐 → 핀이 레지스터까지 닿지 않는다</text>
  <text x="785" y="615" class="body">② 빠짐 → +0x8, +0xC에서 스위치·버튼이 안 읽힌다</text>
  <text x="785" y="645" class="body">③ 빠짐 → 써도 LED가 켜지지 않는다</text>
  <text x="785" y="672" class="small">확인: Elaborated Design(1.6.3절) → Re-Package의 Ports 목록(1.7절)</text>

  <!-- legend -->
  <rect x="380" y="702" width="24" height="18" rx="3" class="user"/>
  <text x="414" y="717" class="body">고친다</text>
  <rect x="520" y="702" width="24" height="18" rx="3" class="tmpl"/>
  <text x="554" y="717" class="body">템플릿 그대로 둔다 (Ctrl+F로 위치만 찾는다)</text>
</svg>
