<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="640" viewBox="0 0 1300 640">
  <style>
    text { font-family: 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #17233c; }
    .sub { font-size: 15px; fill: #526078; }
    .head { font-size: 18px; font-weight: 700; fill: #17233c; }
    .label { font-size: 15px; font-weight: 700; fill: #24324a; }
    .body { font-size: 15px; fill: #33425d; }
    .small { font-size: 13px; fill: #526078; }
    .bit { font-family: Consolas, 'Courier New', monospace; font-size: 24px; font-weight: 700; fill: #17233c; }
    .mono { font-family: Consolas, 'Courier New', monospace; font-size: 16px; fill: #24324a; }
    .monob { font-family: Consolas, 'Courier New', monospace; font-size: 16px; font-weight: 700; fill: #17233c; }
    .base { fill: #eef1f5; stroke: #8794a8; stroke-width: 2; }
    .sel { fill: #fff0d7; stroke: #bd7711; stroke-width: 2.5; }
    .byte { fill: #eaf4ff; stroke: #2e69a3; stroke-width: 2; }
    .cell { fill: #ffffff; stroke: #a7bad0; stroke-width: 1.5; }
    .hdr { fill: #f4f6fa; stroke: #a7bad0; stroke-width: 1.5; }
    .brace { fill: none; stroke-width: 2.2; }
  </style>

  <rect width="1300" height="640" fill="#ffffff"/>
  <text x="650" y="40" text-anchor="middle" class="title">주소 비트로 레지스터를 고르는 방법</text>
  <text x="650" y="66" text-anchor="middle" class="sub">예: PS가 0x43C0_0008을 읽는다. my_io에는 아래 4비트만 들어오고, 그중 [3:2]가 레지스터 번호다.</text>

  <!-- full address -->
  <text x="80" y="128" class="label">PS가 내는 주소</text>
  <text x="80" y="150" class="small">32비트</text>
  <rect x="250" y="105" width="660" height="60" rx="6" class="base"/>
  <text x="580" y="144" text-anchor="middle" class="bit">0100 0011 1100 0000 0000 0000 0000</text>
  <rect x="910" y="105" width="90" height="60" class="sel"/>
  <text x="955" y="144" text-anchor="middle" class="bit">10</text>
  <rect x="1000" y="105" width="90" height="60" class="byte"/>
  <text x="1045" y="144" text-anchor="middle" class="bit">00</text>
  <text x="1140" y="144" class="monob">= 0x43C0_0008</text>

  <text x="250" y="190" class="small">[31]</text>
  <text x="905" y="190" text-anchor="end" class="small">[4]</text>
  <text x="955" y="190" text-anchor="middle" class="small">[3:2]</text>
  <text x="1045" y="190" text-anchor="middle" class="small">[1:0]</text>

  <!-- braces / explanations -->
  <path d="M255 205 V220 H905 V205" class="brace" stroke="#8794a8"/>
  <path d="M580 220 V240" class="brace" stroke="#8794a8"/>
  <rect x="380" y="245" width="400" height="88" rx="10" class="base"/>
  <text x="580" y="275" text-anchor="middle" class="label">어느 IP인가 — 0x43C0_000x</text>
  <text x="580" y="300" text-anchor="middle" class="body">AXI Interconnect가 보고 my_io_0으로 보낸다</text>
  <text x="580" y="322" text-anchor="middle" class="small">my_io 안으로는 들어오지 않는다 (2장 Address Editor)</text>

  <path d="M915 205 V220 H995 V205" class="brace" stroke="#bd7711"/>
  <path d="M955 220 V240" class="brace" stroke="#bd7711"/>
  <rect x="850" y="245" width="160" height="88" rx="10" class="sel"/>
  <text x="930" y="275" text-anchor="middle" class="label">레지스터 번호</text>
  <text x="930" y="300" text-anchor="middle" class="body">2'b10 = 2'h2</text>
  <text x="930" y="322" text-anchor="middle" class="small">→ case의 2'h2 줄</text>

  <path d="M1005 205 V220 H1085 V205" class="brace" stroke="#2e69a3"/>
  <path d="M1045 220 V245" class="brace" stroke="#2e69a3"/>
  <rect x="1030" y="245" width="200" height="88" rx="10" class="byte"/>
  <text x="1130" y="275" text-anchor="middle" class="label">레지스터 안 바이트</text>
  <text x="1130" y="300" text-anchor="middle" class="body">32비트 단위로</text>
  <text x="1130" y="322" text-anchor="middle" class="small">읽고 쓰면 항상 00</text>

  <text x="80" y="383" class="label">템플릿의 Verilog</text>
  <rect x="250" y="360" width="840" height="40" rx="6" class="cell"/>
  <text x="270" y="386" class="mono">case ( axi_araddr[ADDR_LSB+OPT_MEM_ADDR_BITS : ADDR_LSB] )  // = [2+1 : 2] = [3:2]</text>

  <!-- table -->
  <text x="80" y="450" class="label">네 오프셋</text>
  <rect x="250" y="425" width="170" height="40" class="hdr"/>
  <text x="335" y="451" text-anchor="middle" class="label">오프셋</text>
  <rect x="420" y="425" width="250" height="40" class="hdr"/>
  <text x="545" y="451" text-anchor="middle" class="label">아래 4비트 [3:0]</text>
  <rect x="670" y="425" width="190" height="40" class="hdr"/>
  <text x="765" y="451" text-anchor="middle" class="label">[3:2] → case</text>
  <rect x="860" y="425" width="230" height="40" class="hdr"/>
  <text x="975" y="451" text-anchor="middle" class="label">템플릿 레지스터</text>

  <g>
    <rect x="250" y="465" width="170" height="36" class="cell"/><text x="335" y="489" text-anchor="middle" class="monob">+0x0</text>
    <rect x="420" y="465" width="250" height="36" class="cell"/><text x="545" y="489" text-anchor="middle" class="mono"><tspan fill="#a05d0c" font-weight="700">00</tspan> <tspan fill="#2e69a3">00</tspan></text>
    <rect x="670" y="465" width="190" height="36" class="cell"/><text x="765" y="489" text-anchor="middle" class="mono">2'h0</text>
    <rect x="860" y="465" width="230" height="36" class="cell"/><text x="975" y="489" text-anchor="middle" class="mono">slv_reg0</text>
  </g>
  <g>
    <rect x="250" y="501" width="170" height="36" class="cell"/><text x="335" y="525" text-anchor="middle" class="monob">+0x4</text>
    <rect x="420" y="501" width="250" height="36" class="cell"/><text x="545" y="525" text-anchor="middle" class="mono"><tspan fill="#a05d0c" font-weight="700">01</tspan> <tspan fill="#2e69a3">00</tspan></text>
    <rect x="670" y="501" width="190" height="36" class="cell"/><text x="765" y="525" text-anchor="middle" class="mono">2'h1</text>
    <rect x="860" y="501" width="230" height="36" class="cell"/><text x="975" y="525" text-anchor="middle" class="mono">slv_reg1</text>
  </g>
  <g>
    <rect x="250" y="537" width="170" height="36" class="cell" fill="#fffaf0"/><text x="335" y="561" text-anchor="middle" class="monob">+0x8</text>
    <rect x="420" y="537" width="250" height="36" class="cell"/><text x="545" y="561" text-anchor="middle" class="mono"><tspan fill="#a05d0c" font-weight="700">10</tspan> <tspan fill="#2e69a3">00</tspan></text>
    <rect x="670" y="537" width="190" height="36" class="cell"/><text x="765" y="561" text-anchor="middle" class="mono">2'h2</text>
    <rect x="860" y="537" width="230" height="36" class="cell"/><text x="975" y="561" text-anchor="middle" class="mono">slv_reg2</text>
  </g>
  <g>
    <rect x="250" y="573" width="170" height="36" class="cell"/><text x="335" y="597" text-anchor="middle" class="monob">+0xC</text>
    <rect x="420" y="573" width="250" height="36" class="cell"/><text x="545" y="597" text-anchor="middle" class="mono"><tspan fill="#a05d0c" font-weight="700">11</tspan> <tspan fill="#2e69a3">00</tspan></text>
    <rect x="670" y="573" width="190" height="36" class="cell"/><text x="765" y="597" text-anchor="middle" class="mono">2'h3</text>
    <rect x="860" y="573" width="230" height="36" class="cell"/><text x="975" y="597" text-anchor="middle" class="mono">slv_reg3</text>
  </g>
</svg>
