<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5"
        markerWidth="6" markerHeight="6" orient="auto">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#555"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.req {fill:#f3e6fb;stroke:#8e44ad;stroke-width:1;}
.spec{fill:#fbe6ea;stroke:#c0392b;stroke-width:1;}
.part{fill:#fdf3d9;stroke:#c9962c;stroke-width:1;}
.hw  {fill:#e6f1fb;stroke:#378add;stroke-width:1;}
.sw  {fill:#e1f5ee;stroke:#1d9e75;stroke-width:1;}
.itg {fill:#eeedfe;stroke:#7f77dd;stroke-width:1;}
.t   {font:600 12px sans-serif;fill:#1a1a1a;text-anchor:middle;dominant-baseline:central;}
.s   {font:400 10px sans-serif;fill:#333;text-anchor:middle;dominant-baseline:central;}
.al  {stroke:#666;stroke-width:1.6;fill:none;marker-end:url(#arr2);}
</style>
</defs>

<rect x="16" y="16" width="140" height="50" rx="10" class="req"/>
<text x="86" y="36" class="t">① 요구사항 정의</text>
<text x="86" y="52" class="s">시스템 동작·조건 결정</text>

<line x1="156" y1="41" x2="200" y2="41" class="al"/>

<rect x="200" y="16" width="140" height="50" rx="10" class="spec"/>
<text x="270" y="36" class="t">② 사양 확정</text>
<text x="270" y="52" class="s">Specification</text>

<line x1="270" y1="66" x2="270" y2="100" class="al"/>

<rect x="200" y="100" width="140" height="60" rx="10" class="part"/>
<text x="270" y="122" class="t">③ HW/SW 분할</text>
<text x="270" y="140" class="s">Partitioning</text>
<text x="270" y="153" class="s" style="fill:#8a6d1e">PL vs PS 기능 배분</text>

<line x1="200" y1="118" x2="90" y2="200" class="al"/>
<line x1="340" y1="118" x2="450" y2="200" class="al"/>

<rect x="20" y="200" width="140" height="60" rx="10" class="hw"/>
<text x="90" y="222" class="t">④A Hardware 개발</text>
<text x="90" y="240" class="s">Vivado + Verilog</text>
<text x="90" y="253" class="s">PL 회로 설계·검증</text>

<rect x="450" y="200" width="140" height="60" rx="10" class="sw"/>
<text x="520" y="222" class="t">④B Software 개발</text>
<text x="520" y="240" class="s">Vitis + C 코드</text>
<text x="520" y="253" class="s">PS 응용 설계·검증</text>

<line x1="160" y1="230" x2="240" y2="230" class="al"/>
<line x1="450" y1="230" x2="380" y2="230" class="al"/>

<rect x="240" y="200" width="140" height="60" rx="10" class="itg"/>
<text x="310" y="222" class="t">⑤ 통합 및 테스트</text>
<text x="310" y="240" class="s">System Integration</text>
<text x="310" y="253" class="s">보드에서 전체 동작 확인</text>

<path d="M310 200 C 310 170, 270 170, 270 160" class="al" style="stroke-dasharray:4 3"/>
<text x="360" y="180" class="s" style="fill:#888">필요 시 ③으로 되돌아가 반복</text>
</svg>
