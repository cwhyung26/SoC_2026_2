<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
        markerWidth="6" markerHeight="6" orient="auto">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#555"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5"
        markerWidth="6" markerHeight="6" orient="auto">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#378add"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.bg  {fill:#ffffff;}
.pin {fill:#fdf3d9;stroke:#c9962c;stroke-width:1;}
.ip  {fill:#e6f1fb;stroke:#378add;stroke-width:1;}
.sig {fill:#fbe6ea;stroke:#c0392b;stroke-width:1;}
.ps  {fill:#eeedfe;stroke:#7f77dd;stroke-width:1;}
.cpu {fill:#e1f5ee;stroke:#1d9e75;stroke-width:1;}
.zone{fill:none;stroke:#aaa;stroke-width:1;stroke-dasharray:5 4;}
.al  {stroke:#666;stroke-width:1.6;fill:none;marker-end:url(#arr);}
.alb {stroke:#378add;stroke-width:1.4;fill:none;marker-end:url(#arrB);stroke-dasharray:5 3;}
.h   {font:700 13px sans-serif;fill:#1a1a1a;text-anchor:start;}
.t   {font:600 11px sans-serif;fill:#1a1a1a;text-anchor:middle;dominant-baseline:central;}
.s   {font:400 9.5px sans-serif;fill:#444;text-anchor:middle;dominant-baseline:central;}
.sl  {font:400 10px sans-serif;fill:#444;text-anchor:start;dominant-baseline:central;}
.zt  {font:700 11px sans-serif;fill:#888;text-anchor:middle;}
.bl  {font:600 10px sans-serif;fill:#378add;text-anchor:middle;dominant-baseline:central;}
</style>
</defs>

<rect class="bg" x="0" y="0" width="700" height="300"/>

<text class="h" x="16" y="24">스위치 변화가 ISR까지 가는 길</text>

<!-- zones -->
<rect class="zone" x="16" y="44" width="404" height="104" rx="8"/>
<text class="zt" x="218" y="60">PL (FPGA)</text>
<rect class="zone" x="436" y="44" width="248" height="104" rx="8"/>
<text class="zt" x="560" y="60">PS (Cortex-A9)</text>

<!-- 1. pin -->
<rect class="pin" x="28" y="76" width="112" height="52" rx="6"/>
<text class="t" x="84" y="94">shield 스위치</text>
<text class="s" x="84" y="110">sw4[3:0] 값이 바뀜</text>

<line class="al" x1="140" y1="102" x2="166" y2="102"/>

<!-- 2. axi gpio -->
<rect class="ip" x="166" y="70" width="128" height="64" rx="6"/>
<text class="t" x="230" y="86">axi_gpio_0 채널 1</text>
<text class="s" x="230" y="102">IPISR에 pending 세움</text>
<text class="s" x="230" y="117">(IPIER·GIER가 허용해야)</text>

<line class="al" x1="294" y1="102" x2="320" y2="102"/>

<!-- 3. ip2intc_irpt -->
<rect class="sig" x="320" y="76" width="92" height="52" rx="6"/>
<text class="t" x="366" y="94">ip2intc_irpt</text>
<text class="s" x="366" y="110">IP 인터럽트 출력</text>

<line class="al" x1="412" y1="102" x2="444" y2="102"/>

<!-- 4. IRQ_F2P + GIC -->
<rect class="ps" x="444" y="70" width="104" height="64" rx="6"/>
<text class="t" x="496" y="86">IRQ_F2P[0:0]</text>
<text class="s" x="496" y="102">→ GIC</text>
<text class="s" x="496" y="117">(SPI로 접수)</text>

<line class="al" x1="548" y1="102" x2="572" y2="102"/>

<!-- 5. CPU / ISR -->
<rect class="cpu" x="572" y="76" width="100" height="52" rx="6"/>
<text class="t" x="622" y="94">CPU0 IRQ</text>
<text class="s" x="622" y="110">→ ISR 실행</text>

<!-- return data path -->
<path class="alb" d="M622 128 L622 186 L230 186 L230 136"/>
<text class="bl" x="426" y="176">ISR이 AXI4-Lite로 sw4 값을 읽고, IPISR의 pending을 clear</text>

<!-- notes -->
<text class="sl" x="16" y="216">· 인터럽트 선(ip2intc_irpt)은 &quot;변했다&quot;는 사실 하나만 전달한다. 스위치 값은 실려 오지 않는다 — 값은 ISR이 AXI4-Lite로 읽는다.</text>
<text class="sl" x="16" y="238">· pending을 clear하지 않으면 GIC가 같은 인터럽트를 계속 올려서 ISR만 반복되고 main은 영원히 돌아오지 못한다.</text>
<text class="sl" x="16" y="260">· pending은 비트별이 아니라 채널 단위다. sw4 중 어느 비트가 바뀌어도 같은 CH1 pending 하나가 선다.</text>
<text class="sl" x="16" y="282">· 값이 바뀔 때마다 — 올릴 때도, 내릴 때도 — 각각 인터럽트가 된다.</text>
</svg>
