<svg width="700" height="330" viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
        markerWidth="6" markerHeight="6" orient="auto">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#555"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5"
        markerWidth="6" markerHeight="6" orient="auto">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#c0392b"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.bg  {fill:#ffffff;}
.read{fill:#e6f1fb;stroke:#378add;stroke-width:1;}
.idle{fill:#f4f4f4;stroke:#bbb;stroke-width:1;stroke-dasharray:3 2;}
.work{fill:#e1f5ee;stroke:#1d9e75;stroke-width:1;}
.isr {fill:#fbe6ea;stroke:#c0392b;stroke-width:1.2;}
.ax  {stroke:#888;stroke-width:1;}
.ev  {stroke:#c0392b;stroke-width:1.4;stroke-dasharray:4 3;}
.al  {stroke:#666;stroke-width:1.4;fill:none;marker-end:url(#arr);}
.alr {stroke:#c0392b;stroke-width:1.4;fill:none;marker-end:url(#arrR);}
.h   {font:700 13px sans-serif;fill:#1a1a1a;text-anchor:start;}
.t   {font:600 11px sans-serif;fill:#1a1a1a;text-anchor:middle;dominant-baseline:central;}
.s   {font:400 10px sans-serif;fill:#444;text-anchor:middle;dominant-baseline:central;}
.sl  {font:400 10px sans-serif;fill:#444;text-anchor:start;dominant-baseline:central;}
.r   {font:600 10px sans-serif;fill:#c0392b;text-anchor:middle;dominant-baseline:central;}
.lb  {font:600 11px sans-serif;fill:#1a1a1a;text-anchor:end;dominant-baseline:central;}
</style>
</defs>

<rect class="bg" x="0" y="0" width="700" height="330"/>

<!-- ============ panel 1 : polling ============ -->
<text class="h" x="16" y="26">폴링 — 4주차 방식 (200 ms마다 스위치를 읽는다)</text>

<!-- idle stretches -->
<rect class="idle" x="116" y="58" width="94" height="26" rx="4"/>
<rect class="idle" x="236" y="58" width="94" height="26" rx="4"/>
<rect class="idle" x="356" y="58" width="94" height="26" rx="4"/>
<rect class="idle" x="476" y="58" width="94" height="26" rx="4"/>
<text class="s" x="163" y="71">usleep</text>
<text class="s" x="283" y="71">usleep</text>
<text class="s" x="403" y="71">usleep</text>
<text class="s" x="523" y="71">usleep</text>

<!-- read slots -->
<rect class="read" x="90" y="58" width="26" height="26" rx="3"/>
<rect class="read" x="210" y="58" width="26" height="26" rx="3"/>
<rect class="read" x="330" y="58" width="26" height="26" rx="3"/>
<rect class="read" x="450" y="58" width="26" height="26" rx="3"/>
<rect class="read" x="570" y="58" width="26" height="26" rx="3"/>
<text class="s" x="103" y="71">읽기</text>
<text class="s" x="223" y="71">읽기</text>
<text class="s" x="343" y="71">읽기</text>
<text class="s" x="463" y="71">읽기</text>
<text class="s" x="583" y="71">읽기</text>

<text class="lb" x="84" y="71">CPU</text>

<!-- time axis -->
<line class="ax" x1="90" y1="96" x2="620" y2="96"/>
<text class="sl" x="90" y="108">0</text>
<text class="s" x="223" y="108">200 ms</text>
<text class="s" x="343" y="108">400 ms</text>
<text class="s" x="463" y="108">600 ms</text>

<!-- event happens between two reads -->
<line class="ev" x1="268" y1="40" x2="268" y2="100"/>
<text class="r" x="268" y="32">스위치 변화</text>

<!-- latency bracket -->
<line class="alr" x1="270" y1="126" x2="341" y2="126"/>
<text class="r" x="378" y="126">최대 200 ms 늦게 발견</text>
<text class="sl" x="90" y="146">스위치를 안 건드려도 CPU는 계속 읽는다. 짧은 변화는 두 읽기 사이에 지나가 버린다.</text>

<!-- ============ panel 2 : interrupt ============ -->
<text class="h" x="16" y="196">인터럽트 — 5주차 방식 (변화가 생긴 순간에만 CPU가 개입한다)</text>

<rect class="work" x="90" y="228" width="176" height="26" rx="4"/>
<rect class="work" x="286" y="228" width="334" height="26" rx="4"/>
<text class="t" x="178" y="241">main 작업</text>
<text class="t" x="453" y="241">main 작업 (계속 진행)</text>

<rect class="isr" x="266" y="222" width="20" height="38" rx="3"/>
<text class="r" x="276" y="278">ISR</text>

<text class="lb" x="84" y="241">CPU</text>

<line class="ax" x1="90" y1="266" x2="620" y2="266"/>

<line class="ev" x1="268" y1="200" x2="268" y2="222"/>
<text class="r" x="268" y="192">스위치 변화</text>
<text class="r" x="330" y="205">즉시</text>
<line class="alr" x1="300" y1="212" x2="278" y2="220"/>

<text class="sl" x="90" y="300">PL이 &quot;변했다&quot;고 알려 줄 때만 ISR이 짧게 끼어든다. 나머지 시간은 전부 main 것이다.</text>
<text class="sl" x="90" y="318">ISR은 값을 기록만 하고 끝낸다 — LED·터미널 출력 같은 실제 일은 main이 한다.</text>
</svg>
