<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="690" viewBox="0 0 1300 690">
  <style>
    text { font-family: 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #17233c; }
    .sub { font-size: 15px; fill: #526078; }
    .body { font-size: 14px; fill: #33425d; }
    .small { font-size: 13px; fill: #526078; }
    .sig { font-family: Consolas, 'Courier New', monospace; font-size: 15px; font-weight: 700; fill: #17233c; }
    .val { font-family: Consolas, 'Courier New', monospace; font-size: 13px; font-weight: 700; fill: #17233c; }
    .wave { fill: none; stroke: #c96a12; stroke-width: 2.6; }
    .irq { fill: none; stroke: #c63838; stroke-width: 2.6; }
    .flat { fill: none; stroke: #17233c; stroke-width: 2.2; }
    .bus { fill: #eaf4ec; stroke: #31824b; stroke-width: 1.6; }
    .busm { fill: #fff4e6; stroke: #c96a12; stroke-width: 1.6; }
    .rowP { fill: #c96a12; fill-opacity: 0.05; }
    .rowB { fill: #31824b; fill-opacity: 0.05; }
    .tick { stroke: #8794a8; stroke-width: 1.2; }
    .step { font-size: 13px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1300" height="690" fill="#ffffff"/>
  <text x="650" y="40" text-anchor="middle" class="title">캡처 1에서 기대하는 파형 — 인터럽트 한 번의 처음부터 끝까지</text>
  <text x="650" y="66" text-anchor="middle" class="sub">트리거 ila_irq Rising, Trigger position 128. 1024 샘플 = 약 20 µs. 버스 접근의 위치는 예시이고, 실제 샘플 수는 직접 잰다.</text>

  <!-- sample axis: x = 200 + sample * 1000/1024 -->
  <path d="M200 105 H1200" class="tick"/>
  <path d="M200 99 V111 M325 99 V111 M591 99 V111 M786 99 V111 M981 99 V111 M1200 99 V111" class="tick"/>
  <text x="200" y="94" text-anchor="middle" class="small">0</text><text x="325" y="94" text-anchor="middle" class="small">128</text>
  <text x="591" y="94" text-anchor="middle" class="small">400</text><text x="786" y="94" text-anchor="middle" class="small">600</text>
  <text x="981" y="94" text-anchor="middle" class="small">800</text><text x="1200" y="94" text-anchor="middle" class="small">1023</text>
  <text x="1210" y="110" class="small">샘플</text>

  <rect x="30" y="122" width="1240" height="160" class="rowP"/>
  <rect x="30" y="292" width="1240" height="230" class="rowB"/>

  <!-- ila_sw4 : 0 -> 1 just before the trigger -->
  <text x="45" y="160" class="sig">ila_sw4</text>
  <text x="45" y="180" class="small">(4비트)</text>
  <path d="M200 145 H320 L326 160 L320 175 H200" fill="none" stroke="#17233c" stroke-width="2"/>
  <path d="M320 145 L326 160 L320 175" fill="none" stroke="#17233c" stroke-width="2"/>
  <path d="M326 160 L332 145 H1200 M326 160 L332 175 H1200" fill="none" stroke="#17233c" stroke-width="2"/>
  <text x="262" y="165" text-anchor="middle" class="val">0</text>
  <text x="760" y="165" text-anchor="middle" class="val">1</text>

  <!-- ila_irq : rises at 128, falls after the IPISR write (~384) -->
  <text x="45" y="240" class="sig">ila_irq</text>
  <text x="45" y="260" class="small">(ip2intc_irpt)</text>
  <path d="M200 255 H325 V215 H575 V255 H1200" class="irq"/>
  <text x="450" y="207" text-anchor="middle" class="small" fill="#c63838">pending — ISR이 지울 때까지 1</text>

  <!-- bus: AR / AW -->
  <text x="45" y="335" class="sig">ARVALID</text>
  <text x="45" y="355" class="sig">ARADDR</text>
  <path d="M200 340 H489 V320 H497 V340 H528 V320 H536 V340 H1200" class="flat"/>
  <rect x="470" y="362" width="46" height="24" rx="4" class="bus"/><text x="493" y="379" text-anchor="middle" class="val">000</text>
  <rect x="520" y="392" width="46" height="24" rx="4" class="bus"/><text x="543" y="409" text-anchor="middle" class="val">120</text>

  <text x="45" y="450" class="sig">AWVALID</text>
  <text x="45" y="470" class="sig">AWADDR</text>
  <path d="M200 455 H567 V435 H575 V455 H616 V435 H624 V455 H1200" class="flat"/>
  <rect x="548" y="477" width="46" height="24" rx="4" class="bus"/><text x="571" y="494" text-anchor="middle" class="val">120</text>
  <rect x="600" y="477" width="46" height="24" rx="4" class="busm"/><text x="623" y="494" text-anchor="middle" class="val">008</text>

  <!-- step markers -->
  <circle cx="325" cy="300" r="11" fill="#c63838"/><text x="325" y="305" text-anchor="middle" class="step">1</text>
  <circle cx="493" cy="300" r="11" fill="#31824b"/><text x="493" y="305" text-anchor="middle" class="step">2</text>
  <circle cx="543" cy="300" r="11" fill="#31824b"/><text x="543" y="305" text-anchor="middle" class="step">3</text>
  <circle cx="575" cy="300" r="11" fill="#31824b"/><text x="575" y="305" text-anchor="middle" class="step">4</text>
  <circle cx="623" cy="300" r="11" fill="#c96a12"/><text x="623" y="305" text-anchor="middle" class="step">5</text>

  <!-- trigger -->
  <path d="M325 118 V522" stroke="#c63838" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="325" y="540" text-anchor="middle" class="small" fill="#c63838">트리거 (샘플 128)</text>

  <text x="800" y="380" class="small">이 뒤로 버스는 다시 조용하다.</text>
  <text x="800" y="400" class="small">main은 flag만 보며 돌고, xil_printf는 UART라 이 버스에 안 보인다.</text>

  <rect x="30" y="556" width="1240" height="120" rx="10" fill="#f8fafc" stroke="#a7bad0" stroke-width="1.5"/>
  <text x="50" y="582" class="body">① 스위치가 바뀌자 AXI GPIO가 pending을 세우고 ila_irq가 1이 된다. 아직 CPU는 모른다.</text>
  <text x="50" y="604" class="body">② ISR의 Xil_In32(GPIO_DATA) — 000을 읽는다. RDATA에 새 스위치 값이 실려 온다.</text>
  <text x="50" y="626" class="body">③④ ISR의 Xil_Out32(GPIO_IPISR, Xil_In32(GPIO_IPISR)) — 120을 읽고 그 값(1)을 다시 써서 지운다. 쓰기 직후 ila_irq가 0이 된다.</text>
  <text x="50" y="648" class="body">⑤ ISR이 끝나고 main이 flag를 본 뒤 Xil_Out32(GPIO2_DATA, count) — 008에 count를 쓴다. LED가 바뀌는 순간이다.</text>
  <text x="50" y="670" class="body">①에서 ②까지가 "인터럽트가 CPU에 도착해 ISR이 첫 줄을 실행하기까지"의 시간이다.</text>
</svg>
